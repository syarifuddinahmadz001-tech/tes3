<style>

*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex}.sidebar{width:250px;background:#111c35;color:#dce5ff;padding:22px 14px;display:flex;flex-direction:column;flex-shrink:0}.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 24px;border-bottom:1px solid #2c3852;margin-bottom:20px}.brandmark{width:40px;height:40px;border-radius:12px;background:#315fdd;display:grid;place-items:center;color:#fff;font-size:21px;font-weight:800}.brand strong{display:block;color:#fff;font-size:14px}.brand small{color:#a8b6d4}.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:#8291b2;padding:10px 12px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#c5d0e8;text-align:left;padding:11px 12px;border-radius:10px;display:flex;align-items:center;gap:12px}.nav button:hover,.nav button.active{background:#26395f;color:white}.nav .ico{width:19px;text-align:center;font-size:16px}.sidebottom{margin-top:auto;padding:14px 10px 0;color:#91a0bf;font-size:11px;line-height:1.6}.main{min-width:0;flex:1}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:15px;position:sticky;top:0;z-index:5}.top-title{font-weight:750;font-size:17px}.top-sub{font-size:12px;color:var(--muted);margin-top:4px}.top-actions{display:flex;align-items:center;gap:10px}.role-select,.btn,.field,select,textarea{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 12px;color:var(--ink)}.role-select{max-width:210px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:650;white-space:nowrap}.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn-primary:hover{background:#1947bd}.btn-light{background:#fff}.btn-danger{color:var(--red);border-color:#fecaca}.btn-sm{padding:7px 9px;font-size:12px}.content{padding:28px 30px;max-width:1600px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}.pagehead h1{margin:0;font-size:25px;letter-spacing:-.6px}.pagehead p{color:var(--muted);margin:7px 0 0;line-height:1.5}.page-actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.stat{padding:19px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.stat-label{font-size:12px;color:var(--muted);font-weight:600}.stat-value{font-size:29px;font-weight:800;letter-spacing:-1px;margin-top:8px}.stat-note{font-size:11px;color:var(--muted);margin-top:5px}.stat-icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:var(--blue2);color:var(--blue)}.two-col{grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr)}.panel{padding:20px;margin-bottom:17px;min-width:0}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.panel h3{margin:0;font-size:15px}.panel-sub{font-size:12px;color:var(--muted);margin-top:5px}.filterbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}.field,select,textarea{min-width:0}.field:focus,select:focus,textarea:focus{outline:3px solid #dce6ff;border-color:#7f9df5}.filterbar input,.filterbar select{max-width:240px}.table-wrap{width:100%;overflow:auto;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;min-width:680px;background:#fff}th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:#758096;background:#f8f9fc;font-weight:750}th,td{padding:12px 13px;border-bottom:1px solid #edf0f5;vertical-align:middle}td{font-size:12px}tr:last-child td{border-bottom:0}tbody tr:hover{background:#fbfcff}.person{display:flex;align-items:center;gap:9px}.avatar{width:31px;height:31px;border-radius:10px;background:#e6edff;color:#214fc3;display:grid;place-items:center;font-weight:800;font-size:11px;flex-shrink:0}.person strong{display:block;font-size:12px}.person small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.badge{display:inline-flex;padding:5px 8px;border-radius:99px;font-size:11px;font-weight:750;white-space:nowrap}.b-hadir{background:var(--greenbg);color:var(--green)}.b-terlambat{background:var(--orangebg);color:var(--orange)}.b-izin{background:#dbeafe;color:#1d4ed8}.b-sakit{background:var(--purplebg);color:var(--purple)}.b-alpa{background:var(--redbg);color:var(--red)}.b-belum{background:var(--graybg);color:#596579}.b-menunggu{background:var(--orangebg);color:var(--orange)}.b-disetujui{background:var(--greenbg);color:var(--green)}.b-ditolak{background:var(--redbg);color:var(--red)}.bar-list{display:grid;gap:16px}.bar-row{display:grid;grid-template-columns:85px 1fr 35px;gap:10px;align-items:center;font-size:12px}.track{height:8px;background:#edf0f6;border-radius:20px;overflow:hidden}.fill{height:100%;border-radius:20px;background:var(--blue)}.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.quick{padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;display:flex;align-items:center;gap:11px}.quick:hover{border-color:#9bb4ff;background:#fafbff}.quick span:first-child{width:36px;height:36px;display:grid;place-items:center;background:var(--blue2);border-radius:10px;font-size:17px}.quick strong{display:block;font-size:12px}.quick small{display:block;color:var(--muted);margin-top:4px;font-size:10px}.notice{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #eef0f5}.notice:last-child{border-bottom:0}.notice-dot{width:8px;height:8px;border-radius:50%;background:#e9a23b;margin-top:5px;flex-shrink:0}.notice strong{font-size:12px}.notice p{margin:4px 0 0;color:var(--muted);font-size:11px;line-height:1.5}.empty{text-align:center;padding:35px 12px;color:var(--muted)}.empty .big{font-size:28px;margin-bottom:8px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.form-group{display:grid;gap:6px}.form-group.full{grid-column:1/-1}.form-group label{font-size:12px;font-weight:700;color:#48546a}.form-group input,.form-group select,.form-group textarea{width:100%}.form-group textarea{min-height:80px;resize:vertical}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.noticebox{padding:12px 14px;background:#f0f5ff;border:1px solid #d9e5ff;border-radius:10px;color:#29488d;font-size:12px;line-height:1.6;margin-bottom:16px}.warningbox{padding:12px 14px;background:#fff8e8;border:1px solid #f7df9e;border-radius:10px;color:#85540b;font-size:12px;line-height:1.6;margin-bottom:16px}.modal-backdrop{position:fixed;inset:0;background:rgba(10,20,40,.48);z-index:20;display:none;align-items:center;justify-content:center;padding:18px}.modal-backdrop.open{display:flex}.modal{width:min(600px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 20px 70px #0b173b40}.modal h2{margin:0 0 6px;font-size:20px}.modal .muted{color:var(--muted);font-size:12px;margin-bottom:20px}.toast{position:fixed;right:22px;bottom:22px;background:#172033;color:#fff;padding:13px 17px;border-radius:10px;box-shadow:var(--shadow);z-index:50;display:none;max-width:min(400px,calc(100vw - 35px));font-size:13px}.toast.show{display:block}.mobile-menu{display:none}.footer-note{font-size:11px;color:var(--muted);line-height:1.6;margin-top:14px}.hidden{display:none!important}.inline-actions{display:flex;gap:6px;flex-wrap:wrap}.progress-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:15px}.mini-stat{border:1px solid var(--line);padding:12px;border-radius:10px}.mini-stat small{display:block;color:var(--muted);font-size:11px}.mini-stat strong{display:block;font-size:20px;margin-top:5px}
@media(max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two-col{grid-template-columns:1fr}.content{padding:22px}.topbar{padding:0 22px}}
@media(max-width:760px){.sidebar{position:fixed;z-index:15;left:-270px;top:0;bottom:0;transition:left .2s}.sidebar.open{left:0}.mobile-menu{display:inline-flex}.topbar{height:68px;padding:0 15px}.top-title{font-size:14px}.top-sub{display:none}.role-select{max-width:135px;padding:8px;font-size:11px}.content{padding:19px 14px}.pagehead{display:block}.pagehead h1{font-size:22px}.page-actions{margin-top:14px}.stats{gap:10px}.stat{padding:14px}.stat-value{font-size:24px}.stat-icon{width:33px;height:33px}.form-grid{grid-template-columns:1fr}.form-group.full{grid-column:auto}.panel{padding:15px}.quick-grid{grid-template-columns:1fr 1fr}.bar-row{grid-template-columns:72px 1fr 28px}.progress-summary{grid-template-columns:1fr 1fr}.hide-mobile{display:none!important}}
@media(max-width:390px){.stats{grid-template-columns:1fr 1fr}.stat-label{font-size:11px}.stat-value{font-size:22px}.quick-grid{grid-template-columns:1fr}.top-actions{gap:5px}}
</style>

<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brandmark">✓</div><div><strong>MONITOR SISWA</strong><small>Presensi & kedisiplinan</small></div></div>
    <div class="nav-label">Menu utama</div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebottom">Prototipe aplikasi sekolah<br>Data tersimpan di browser ini.</div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px;min-width:0">
        <button class="btn mobile-menu" id="menuToggle" aria-label="Buka menu">☰</button>

      </div>
      <div class="top-actions">
        <select class="role-select" id="roleSelect" aria-label="Simulasi peran pengguna">
          <option value="admin">Administrator</option><option value="piket">Guru Piket</option><option value="wali">Wali Kelas</option><option value="siswa">Siswa</option>
        </select>
        <button class="btn" id="profileBtn" title="Profil pengguna">● <span id="userName">Admin</span></button>
      </div>
    </header>
    <section class="content" id="content"></section>
  </main>
</div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const today = () => {const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const shiftDate = (days) => {const d=new Date();d.setDate(d.getDate()+days);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const fmtDate = d => d ? new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}) : '-';
const esc = v => String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials = name => String(name||'?').split(' ').filter(Boolean).slice(0,2).map(s=>s[0]).join('').toUpperCase();
const statusLabel = s => ({hadir:'Hadir',terlambat:'Terlambat',izin:'Izin',sakit:'Sakit',alpa:'Alpa','belum':'Belum terkonfirmasi'})[s]||s;
const badge = s => `<span class="badge b-${esc(s)}">${esc(statusLabel(s))}</span>`;
const roles = {admin:{label:'Administrator',name:'Administrator Sekolah'},piket:{label:'Guru Piket',name:'Guru Piket'},wali:{label:'Wali Kelas',name:'Ibu Siti Rahma'},siswa:{label:'Siswa',name:'Andi Pratama'}};
const demoStudents = [
 ['2026001','Andi Pratama','X Nautika'],['2026002','Bunga Lestari','X Nautika'],['2026003','Candra Wijaya','X Nautika'],['2026004','Dewi Anggraini','X Nautika'],['2026005','Eko Saputra','X Nautika'],['2026006','Fitri Amelia','X Nautika'],['2026007','Galang Ramadhan','X Teknika'],['2026008','Hana Putri','X Teknika'],['2026009','Indra Kurniawan','X Teknika'],['2026010','Jihan Safitri','X Teknika'],['2026011','Kevin Maulana','XI Nautika'],['2026012','Laila Zahra','XI Nautika'],['2026013','Muhammad Rizki','XI Nautika'],['2026014','Nadia Permata','XI Teknika'],['2026015','Oscar Firmansyah','XI Teknika'],['2026016','Putri Maharani','XI Teknika'],['2026017','Rafi Akbar','XII Nautika'],['2026018','Salsa Nabila','XII Nautika'],['2026019','Tegar Prakoso','XII Teknika'],['2026020','Vina Oktavia','XII Teknika']
].map(([nis,nama,kelas],i)=>({id:nis,nis,nama,kelas,aktif:true,role:i===0?'siswa':undefined}));
function seed(){
 const students=demoStudents.map(s=>({...s}));
 const attendance=[];
 const statuses=['hadir','hadir','hadir','hadir','terlambat','hadir','izin','sakit','hadir','alpa','hadir','hadir','terlambat','hadir','hadir','hadir','belum','hadir','hadir','terlambat'];
 students.forEach((s,i)=>{attendance.push({id:`${s.id}-${today()}`,studentId:s.id,date:today(),status:statuses[i],time:statuses[i]==='terlambat'?`07:${String(8+i%18).padStart(2,'0')}`:statuses[i]==='hadir'?`06:${String(45+i%14).padStart(2,'0')}`:'',reason:statuses[i]==='izin'?'Keperluan keluarga':statuses[i]==='sakit'?'Kurang sehat':statuses[i]==='alpa'?'Belum ada keterangan':statuses[i]==='terlambat'?'Kendala perjalanan':'',recorder:'Guru Piket',verified:statuses[i]!=='belum'});});
 const requests=[
 {id:'REQ-001',studentId:'2026002',type:'izin',start:shiftDate(0),end:shiftDate(0),reason:'Keperluan keluarga',status:'menunggu',submitted:today(),decision:'',decisionReason:''},
 {id:'REQ-002',studentId:'2026006',type:'sakit',start:today(),end:today(),reason:'Kurang sehat',status:'disetujui',submitted:today(),decision:'Wali Kelas',decisionReason:''},
 {id:'REQ-003',studentId:'2026008',type:'izin',start:shiftDate(1),end:shiftDate(1),reason:'Mengikuti kegiatan keluarga',status:'menunggu',submitted:today(),decision:'',decisionReason:''}
 ];
 return {students,attendance,requests,followups:[],teachers:[{id:'G001',nama:'Siti Rahma',role:'wali',kelas:'X Nautika'},{id:'G002',nama:'Budi Santoso',role:'piket',kelas:''},{id:'G003',nama:'Administrator Sekolah',role:'admin',kelas:''}],classes:['X Nautika','X Teknika','XI Nautika','XI Teknika','XII Nautika','XII Teknika'],settings:{school:'Sekolah Contoh',academicYear:'2026/2027',semester:'Ganjil',entryTime:'07:00',lateAfter:'07:00',schoolDays:[1,2,3,4,5,6],lateThreshold:3,absenceThreshold:3},logs:[],notifications:[]};
}
let db;
try{db=JSON.parse(localStorage.getItem('monitorSiswaDB'))||seed()}catch(e){db=seed()}
let role=localStorage.getItem('monitorSiswaRole')||'admin';
let page='dashboard',searchTerm='',filterClass='semua',filterStatus='semua',filterDate=today(),reportStart=shiftDate(-6),reportEnd=today();
function save(){localStorage.setItem('monitorSiswaDB',JSON.stringify(db))}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2800)}
function activeStudents(){return db.students.filter(s=>s.aktif!==false)}
function student(id){return db.students.find(s=>s.id===id)||{nama:'Siswa tidak ditemukan',nis:'-',kelas:'-'}}
function recordFor(id,date){return db.attendance.find(a=>a.studentId===id&&a.date===date)}
function requestsFor(id){return db.requests.filter(r=>!id||r.studentId===id)}
function currentClass(){return role==='wali'?'X Nautika':null}
function permittedStudents(){let all=activeStudents();if(role==='wali')all=all.filter(s=>s.kelas===currentClass());if(role==='siswa')all=all.filter(s=>s.id==='2026001');return all}
function attendanceFor(date,students=activeStudents()){return students.map(s=>recordFor(s.id,date)||{studentId:s.id,date,status:'belum',time:'',reason:'',verified:false})}
function countStatus(records,status){return records.filter(r=>r.status===status).length}
function fmtTime(t){return t||'-'}
function roleNav(){
 const common=[['dashboard','▦','Dashboard']];
 if(role==='admin')return [...common,['attendance','☑','Data Kehadiran'],['lateness','◷','Keterlambatan'],['requests','▤','Izin dan Sakit'],['monitor','◎','Monitoring Siswa'],['reports','▥','Laporan'],['students','♙','Data Siswa'],['teachers','♧','Data Guru'],['classes','▦','Data Kelas'],['notifications','♢','Notifikasi'],['settings','⚙','Pengaturan'],['logs','↺','Riwayat Perubahan']];
 if(role==='piket')return [...common,['attendance','☑','Data Kehadiran'],['lateness','◷','Keterlambatan'],['requests','▤','Izin dan Sakit'],['reports','▥','Laporan'],['notifications','♢','Notifikasi']];
 if(role==='wali')return [...common,['monitor','◎','Monitoring Siswa'],['lateness','◷','Keterlambatan'],['requests','▤','Izin dan Sakit'],['reports','▥','Laporan'],['notifications','♢','Notifikasi']];
 return [...common,['myattendance','☑','Riwayat Kehadiran'],['myrequest','▤','Ajukan Izin / Sakit'],['notifications','♢','Notifikasi']];
}
function renderNav(){ $('#nav').innerHTML=roleNav().map(([id,icon,label])=>`<button data-page="${id}" class="${page===id?'active':''}"><span class="ico">${icon}</span><span>${label}</span></button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>navigate(b.dataset.page));}
function navigate(p){page=p;searchTerm='';$('#sidebar').classList.remove('open');renderNav();renderPage()}
function pageTitle(){const found=roleNav().find(n=>n[0]===page);return found?found[2]:'Dashboard'}
function pageHead(title,sub,actions=''){return `<div class="pagehead"><div><h1>${title}</h1><p>${sub}</p></div><div class="page-actions">${actions}</div></div>`}
function statCard(label,value,note,icon,color='blue'){let bg={green:'#dcfce7',orange:'#fef3c7',blue:'#eaf0ff',purple:'#f3e8ff',red:'#fee2e2',gray:'#edf0f5'}[color]||'#eaf0ff';let fg={green:'#15803d',orange:'#b45309',blue:'#2457d6',purple:'#7e22ce',red:'#b91c1c',gray:'#596579'}[color]||'#2457d6';return `<div class="stat"><div><div class="stat-label">${label}</div><div class="stat-value">${value}</div><div class="stat-note">${note}</div></div><div class="stat-icon" style="background:${bg};color:${fg}">${icon}</div></div>`}
function table(headers,rows,empty='Belum ada data untuk ditampilkan.'){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${headers.length}"><div class="empty"><div class="big">⌕</div>${empty}</div></td></tr>`}</tbody></table></div>`}
function personCell(s){return `<div class="person"><div class="avatar">${esc(initials(s.nama))}</div><div><strong>${esc(s.nama)}</strong><small>${esc(s.nis)}</small></div></div>`}
function dashboard(){
 const students=permittedStudents(),records=attendanceFor(today(),students),reqs=requestsFor(role==='siswa'?'2026001':null),pending=reqs.filter(r=>r.status==='menunggu').length;
 const total=students.length,hadir=countStatus(records,'hadir'),late=countStatus(records,'terlambat'),izin=countStatus(records,'izin'),sakit=countStatus(records,'sakit'),alpa=countStatus(records,'alpa'),unconfirmed=countStatus(records,'belum');
 const cards=role==='siswa'?[statCard('Hadir',hadir,'Catatan hari ini','✓','green'),statCard('Terlambat',late,'Catatan hari ini','◷','orange'),statCard('Izin / Sakit',izin+sakit,'Hari ini','▤','blue'),statCard('Alpa',alpa,'Sudah diverifikasi','!','red')]:[
 statCard('Total siswa',total,'Siswa aktif dalam cakupan','♙','blue'),statCard('Hadir',hadir,'Status hadir hari ini','✓','green'),statCard('Terlambat',late,'Perlu pemantauan','◷','orange'),statCard('Izin / Sakit',izin+sakit,'Ketidakhadiran berketerangan','▤','purple'),statCard('Alpa terverifikasi',alpa,'Perlu tindak lanjut','!','red'),statCard('Belum terkonfirmasi',unconfirmed,'Belum boleh dianggap alpa','?','gray'),statCard('Menunggu persetujuan',pending,'Permohonan belum diperiksa','⌛','orange'),statCard('Kelas aktif',new Set(students.map(s=>s.kelas)).size,'Dalam cakupan tampilan','▦','blue')];
 const statusList=['hadir','terlambat','izin','sakit','alpa','belum'];
 const bar=statusList.map(s=>{const n=countStatus(records,s),pct=total?Math.round(n/total*100):0;const colors={hadir:'#16a34a',terlambat:'#d97706',izin:'#2563eb',sakit:'#9333ea',alpa:'#dc2626',belum:'#9ca3af'};return `<div class="bar-row"><span>${statusLabel(s)}</span><div class="track"><div class="fill" style="width:${pct}%;background:${colors[s]}"></div></div><strong>${n}</strong></div>`}).join('');
 const recent=records.filter(r=>r.status!=='belum').slice(0,7).map(r=>{const s=student(r.studentId);return `<tr><td>${personCell(s)}</td><td>${esc(s.kelas)}</td><td>${fmtTime(r.time)}</td><td>${badge(r.status)}</td><td>${esc(r.reason||'-')}</td></tr>`});
 const notices=[];

 const ad=$('#attDate');if(ad)ad.addEventListener('change',e=>{filterDate=e.target.value;renderPage()});
 const sd=$('#startDate');if(sd)sd.addEventListener('change',e=>{reportStart=e.target.value;renderPage()});
 const ed=$('#endDate');if(ed)ed.addEventListener('change',e=>{reportEnd=e.target.value;renderPage()});
 const settings=$('#settingsForm');if(settings)settings.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(settings);db.settings.school=f.get('school').trim();db.settings.academicYear=f.get('academicYear').trim();db.settings.semester=f.get('semester');db.settings.entryTime=f.get('entryTime');db.settings.lateAfter=f.get('lateAfter');db.settings.lateThreshold=Math.max(1,Number(f.get('lateThreshold'))||3);db.settings.absenceThreshold=Math.max(1,Number(f.get('absenceThreshold'))||3);save();log('Ubah pengaturan','Konfigurasi sekolah diperbarui');save();toast('Pengaturan berhasil disimpan');renderPage()});
 $('#content').querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.action,b.dataset.id)));
}
function action(name,id){
 if(name==='quick-attendance'){navigate(role==='siswa'?'myattendance':'attendance');return}
 if(name==='mark-all'){if(role==='siswa')return toast('Siswa tidak dapat mengubah kehadiran.');$('#content').querySelectorAll('.status-edit').forEach(s=>s.value='hadir');toast('Semua status pada daftar ditandai hadir. Periksa sebelum menyimpan.');return}
 if(name==='save-attendance'){saveAttendance();return}
 if(name==='reset-att-filter'){filterClass='semua';searchTerm='';filterDate=today();renderPage();return}
 if(name==='new-request'){openRequestModal();return}
 if(name==='approve'){decideRequest(id,'disetujui');return}
 if(name==='reject'){decideRequest(id,'ditolak');return}
 if(name==='new-student'){openStudentModal();return}
 if(name==='edit-student'){openStudentModal(id);return}
 if(name==='toggle-student'){const s=db.students.find(x=>x.id===id);if(!s)return;if(confirm(`${s.aktif===false?'Aktifkan':'Nonaktifkan'} ${s.nama}?`)){s.aktif=s.aktif===false;log('Ubah status siswa',`${s.nama}: ${s.aktif?'aktif':'nonaktif'}`);save();renderPage();toast('Status siswa diperbarui.')}return}
 if(name==='followup'){openFollowupModal(id);return}
 if(name==='new-class'){openClassModal();return}
 if(name==='print'){window.print();return}
 if(name==='export-csv'){exportCSV();return}
 if(name==='reset-report'){filterClass='semua';filterStatus='semua';searchTerm='';reportStart=shiftDate(-6);reportEnd=today();renderPage();return}
 if(name==='backup'){download('monitor-siswa-backup.json',JSON.stringify(db,null,2),'application/json');toast('Cadangan JSON diunduh.');return}
 if(name==='reset-demo'){if(confirm('Reset semua data prototipe ke data demo? Perubahan lokal akan hilang.')){db=seed();save();log('Reset demo','Data dikembalikan ke data awal');save();renderPage();toast('Data demo berhasil dipulihkan.')}return}
}
function saveAttendance(){
 if(role==='siswa')return toast('Siswa tidak memiliki akses untuk mengubah kehadiran.');
 const rows=$('#content').querySelectorAll('.status-edit');if(!rows.length)return toast('Tidak ada siswa untuk disimpan.');
 const updates=[];
 rows.forEach(sel=>{const id=sel.dataset.id;const status=sel.value;const time=$(`#content .time-edit[data-id="${id}"]`)?.value||'';const reason=$(`#content .reason-edit[data-id="${id}"]`)?.value.trim()||'';if(status==='terlambat'&&!time){toast(`Isi jam datang untuk ${student(id).nama}.`);return}updates.push({id,status,time,reason})});
 if(!updates.length)return;
 if(!confirm(`Simpan perubahan status untuk ${updates.length} siswa pada ${fmtDate(filterDate)}?`))return;
 updates.forEach(u=>{let r=recordFor(u.id,filterDate);const before=r?`${r.status}/${r.time}`:'belum ada';if(!r){r={id:`${u.id}-${filterDate}`,studentId:u.id,date:filterDate};db.attendance.push(r)}Object.assign(r,{status:u.status,time:u.time,reason:u.reason,recorder:roles[role].label,verified:u.status!=='belum'});if(before!==`${u.status}/${u.time}`)log('Ubah kehadiran',`${student(u.id).nama} · ${filterDate} · ${before} → ${u.status}/${u.time||'-'}${u.reason?' · '+u.reason:''}`)});
 save();renderPage();toast('Data kehadiran berhasil disimpan.');
}
function openModal(html){$('#modal').innerHTML=html;$('#modalBackdrop').classList.add('open');$('#modalBackdrop').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal)}
function closeModal(){$('#modalBackdrop').classList.remove('open')}
function openRequestModal(){
 const s=student('2026001');
 openModal(`<h2>Pengajuan izin / sakit</h2><div class="muted">Lengkapi data permohonan. Pengajuan akan menunggu verifikasi.</div><form id="requestForm"><div class="form-grid"><div class="form-group full"><label>Nama siswa</label><input class="field" value="${esc(s.nama)} · ${esc(s.kelas)}" disabled></div><div class="form-group"><label>Jenis pengajuan</label><select name="type" required><option value="izin">Izin</option><option value="sakit">Sakit</option></select></div><div class="form-group"><label>Tanggal mulai</label><input class="field" name="start" type="date" value="${today()}" required></div><div class="form-group"><label>Tanggal selesai</label><input class="field" name="end" type="date" value="${today()}" required></div><div class="form-group full"><label>Alasan</label><textarea name="reason" required maxlength="500" placeholder="Tuliskan alasan secara singkat"></textarea></div></div><div class="form-actions"><button type="button" class="btn" data-close>Batal</button><button class="btn btn-primary" type="submit">Kirim pengajuan</button></div></form>`);
 $('#requestForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),start=f.get('start'),end=f.get('end'),reason=f.get('reason').trim();if(end<start)return toast('Tanggal selesai tidak boleh sebelum tanggal mulai.');if(!reason)return toast('Alasan wajib diisi.');const req={id:'REQ-'+String(Date.now()).slice(-7),studentId:'2026001',type:f.get('type'),start,end,reason,status:'menunggu',submitted:today(),decision:'',decisionReason:''};db.requests.push(req);log('Buat permohonan',`${req.id} · ${req.type}`);save();closeModal();navigate('myrequest');toast('Pengajuan berhasil dikirim.');};
}
function decideRequest(id,status){
 const r=db.requests.find(x=>x.id===id);if(!r)return;
 let reason='';if(status==='ditolak'){reason=prompt('Tuliskan alasan penolakan:');if(reason===null)return;if(!reason.trim())return toast('Alasan penolakan wajib diisi.');}
 if(!confirm(`${status==='disetujui'?'Setujui':'Tolak'} permohonan ${id}?`))return;
 r.status=status;r.decision=roles[role].label;r.decisionReason=reason;
 if(status==='disetujui'){const dates=[];let d=new Date(r.start+'T00:00:00'),end=new Date(r.end+'T00:00:00');for(let i=0;i<40&&d<=end;i++,d.setDate(d.getDate()+1)){const day=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;dates.push(day)}dates.forEach(date=>{let a=recordFor(r.studentId,date);if(!a){a={id:`${r.studentId}-${date}`,studentId:r.studentId,date};db.attendance.push(a)}if(a.status==='belum'||!a.status){a.status=r.type;a.time='';a.reason=r.reason;a.recorder=roles[role].label;a.verified=true}})}
 log('Verifikasi permohonan',`${id} · ${status}${reason?' · '+reason:''}`);save();renderPage();toast(`Permohonan ${status}.`);
}
function openStudentModal(id){
 const s=id?db.students.find(x=>x.id===id):{id:'',nis:'',nama:'',kelas:db.classes[0],aktif:true};
 openModal(`<h2>${id?'Edit data siswa':'Tambah siswa'}</h2><div class="muted">Lengkapi identitas siswa.</div><form id="studentForm"><div class="form-grid"><div class="form-group"><label>NIS</label><input class="field" name="nis" required value="${esc(s.nis)}" ${id?'readonly':''}></div><div class="form-group"><label>Nama lengkap</label><input class="field" name="nama" required value="${esc(s.nama)}"></div><div class="form-group full"><label>Kelas</label><select name="kelas">${db.classes.map(c=>`<option ${s.kelas===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div></div><div class="form-actions"><button type="button" class="btn" data-close>Batal</button><button class="btn btn-primary" type="submit">Simpan siswa</button></div></form>`);
 $('#studentForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),nis=f.get('nis').trim(),nama=f.get('nama').trim(),kelas=f.get('kelas');if(!id&&db.students.some(x=>x.nis===nis))return toast('NIS sudah digunakan.');if(id){Object.assign(s,{nama,kelas});}else db.students.push({id:nis,nis,nama,kelas,aktif:true});log(id?'Edit siswa':'Tambah siswa',`${nama} · ${nis}`);save();closeModal();renderPage();toast('Data siswa disimpan.');};
}
function openFollowupModal(id){
 const s=student(id);
 openModal(`<h2>Catatan tindak lanjut</h2><div class="muted">${esc(s.nama)} · ${esc(s.kelas)}</div><form id="followForm"><div class="form-grid"><div class="form-group"><label>Tanggal</label><input name="date" type="date" class="field" value="${today()}" required></div><div class="form-group"><label>Jenis masalah</label><select name="type"><option>Keterlambatan</option><option>Ketidakhadiran</option><option>Pembinaan umum</option><option>Lainnya</option></select></div><div class="form-group full"><label>Catatan pembinaan</label><textarea name="note" required></textarea></div><div class="form-group full"><label>Rencana tindak lanjut</label><textarea name="plan"></textarea></div></div><div class="form-actions"><button class="btn" type="button" data-close>Batal</button><button class="btn btn-primary" type="submit">Simpan catatan</button></div></form>`);
 $('#followForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);db.followups.push({id:'F-'+Date.now(),studentId:id,date:f.get('date'),type:f.get('type'),note:f.get('note').trim(),plan:f.get('plan').trim(),teacher:roles[role].name});log('Catatan tindak lanjut',s.nama);save();closeModal();renderPage();toast('Catatan tindak lanjut disimpan.');};
}
function openClassModal(){openModal(`<h2>Tambah kelas</h2><div class="muted">Tambahkan nama kelas baru untuk data prototipe.</div><form id="classForm"><div class="form-group"><label>Nama kelas</label><input name="name" class="field" required placeholder="Contoh: X Pelayaran"></div><div class="form-actions"><button type="button" class="btn" data-close>Batal</button><button class="btn btn-primary" type="submit">Tambah kelas</button></div></form>`);$('#classForm').onsubmit=e=>{e.preventDefault();const name=new FormData(e.target).get('name').trim();if(db.classes.includes(name))return toast('Kelas sudah tersedia.');db.classes.push(name);log('Tambah kelas',name);save();closeModal();renderPage();toast('Kelas ditambahkan.');}}
function exportCSV(){
 const rows=db.attendance.filter(r=>r.date>=reportStart&&r.date<=reportEnd).filter(r=>permittedStudents().some(s=>s.id===r.studentId)).filter(r=>filterClass==='semua'||student(r.studentId).kelas===filterClass).filter(r=>filterStatus==='semua'||r.status===filterStatus).filter(r=>{const s=student(r.studentId);return `${s.nama} ${s.nis}`.toLowerCase().includes(searchTerm.toLowerCase())});
 const data=[['Tanggal','NIS','Nama','Kelas','Status','Jam datang','Catatan','Petugas'],...rows.map(r=>[r.date,student(r.studentId).nis,student(r.studentId).nama,student(r.studentId).kelas,statusLabel(r.status),r.time||'',r.reason||'',r.recorder||''])];
 const csv=data.map(row=>row.map(v=>{let x=String(v??'');if(/^[=+\-@\t\r]/.test(x))x="'"+x;return '"'+x.replace(/"/g,'""')+'"'}).join(',')).join('\r\n');
 download(`laporan-kehadiran-${reportStart}-${reportEnd}.csv`,'\ufeff'+csv,'text/csv;charset=utf-8');toast('Laporan CSV berhasil dibuat.');
}
function download(name,data,type){const blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}
$('#roleSelect').addEventListener('change',e=>{role=e.target.value;localStorage.setItem('monitorSiswaRole',role);page='dashboard';filterClass='semua';filterStatus='semua';renderPage();toast(`Mode tampilan: ${roles[role].label}`)});
$('#menuToggle').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
$('#modalBackdrop').addEventListener('click',e=>{if(e.target===$('#modalBackdrop'))closeModal()});
$('#profileBtn').addEventListener('click',()=>toast(`Mode demo: ${roles[role].label}. Gunakan pilihan peran untuk menguji aplikasi.`));
window.addEventListener('storage',()=>{try{db=JSON.parse(localStorage.getItem('monitorSiswaDB'))||db;renderPage()}catch(e){}});
save();renderPage();
})();
</script>
</body>
</html>
